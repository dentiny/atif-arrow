[workspace]
members = ["crates/atif-arrow", "crates/atif-io", "crates/atif-arrow-cli", "crates/opendal-service-harborhub"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/dentiny/atif-arrow"

[workspace.dependencies]
arrow-array = "59.3.0"
arrow-json = "59.3.0"
arrow-schema = "59.3.0"
atif-arrow = { path = "crates/atif-arrow", version = "0.4.3" }
atif-io = { path = "crates/atif-io", version = "0.4.3" }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
opendal = { version = "0.59.3", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
time = { version = "0.3", default-features = false, features = ["parsing"] }
