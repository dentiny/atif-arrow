version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep these related crates on manually coordinated versions.
    ignore:
      - dependency-name: "arrow"
      - dependency-name: "arrow-*"
      - dependency-name: "parquet"
      - dependency-name: "parquet-*"
      - dependency-name: "datafusion"
      - dependency-name: "datafusion-*"
      - dependency-name: "lance"
      - dependency-name: "lance-*"
