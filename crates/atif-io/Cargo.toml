[package]
name = "atif-io"
description = "JSON and JSONL trajectory readers for ATIF to Arrow conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["gzip"]
gzip = ["dep:async-compression"]

[dependencies]
atif-arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
async-compression = { version = "0.4.50", default-features = false, features = ["futures-io", "gzip"], optional = true }
opendal.workspace = true
futures.workspace = true
base64 = "0.22"
serde_json.workspace = true
url = "2"
tokio = { version = "1", features = ["rt", "fs"] }

[dev-dependencies]
arrow-json.workspace = true
crc32fast = "1"
flate2 = "1"
opendal = { workspace = true, features = ["services-fs"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "multimodal"
path = "../../examples/multimodal.rs"
